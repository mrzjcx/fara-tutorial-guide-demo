<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧医院 · 门诊缴费</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#333;display:flex;justify-content:center;padding:20px 12px;min-height:100vh}
.app{width:100%;max-width:720px}
.top-bar{background:linear-gradient(135deg,#e67e22,#f39c12);color:#fff;padding:20px 24px;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:14px}
.top-bar .icon{font-size:36px}.top-bar h1{font-size:19px;font-weight:700}.top-bar .sub{font-size:11px;opacity:.8}
.home-link{color:#fff;text-decoration:none;font-size:11px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
.summary-bar{background:#fff;padding:16px 24px;display:flex;gap:16px;border-bottom:1px solid #eee}
.summary-item{flex:1;text-align:center}.summary-item .val{font-size:20px;font-weight:700;color:#e67e22}.summary-item .lab{font-size:10px;color:#999;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:2px solid #eee}
.tab{flex:1;text-align:center;padding:14px 8px;font-size:13px;cursor:pointer;color:#999;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;font-weight:500}
.tab.active{color:#e67e22;border-bottom-color:#e67e22}
.tab .badge{border-radius:10px;padding:1px 7px;font-size:10px;color:#fff;margin-left:4px}
.content{background:#fff;padding:24px;min-height:380px}
.content h2{font-size:17px;margin-bottom:16px;color:#333}
.bill-card{border:1px solid #e8e8e8;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.bill-card:hover{border-color:#e67e22;box-shadow:0 2px 8px rgba(230,126,34,.1)}
.bill-card.selected{border-color:#e67e22;background:#fff8f0}
.bill-card .hdr{display:flex;justify-content:space-between;align-items:flex-start}
.bill-card .ttl{font-size:15px;font-weight:700}
.bill-card .dept{font-size:11px;color:#999}
.bill-card .date{font-size:11px;color:#bbb;margin-top:2px}
.bill-card .items{margin-top:8px}
.bill-card .item{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.bill-card .item .ln{color:#999}
.bill-card .footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0}
.bill-card .total{font-size:18px;font-weight:700;color:#e67e22}
.bill-card .status{padding:2px 10px;border-radius:10px;font-weight:600;font-size:11px}
.s-unpaid{background:#fef3e4;color:#e67e22}.s-paid{background:#e8f8e8;color:#27ae60}
.detail-panel{background:#f8fafc;border-radius:12px;padding:18px;margin-bottom:12px}
.detail-panel .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.detail-panel .row .lbl{color:#999}
.insurance-breakdown{background:#f0faf4;border-radius:10px;padding:14px;margin:12px 0}
.insurance-breakdown .row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.insurance-breakdown .row.total{border-top:1px solid #d4edda;margin-top:4px;padding-top:6px;font-weight:700}
.method-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.method-card{border:1px solid #e8e8e8;border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;transition:.15s}
.method-card:hover{border-color:#e67e22}.method-card.selected{border-color:#e67e22;background:#fff8f0}
.method-card .icon{font-size:32px;display:block;margin-bottom:6px}.method-card .name{font-size:12px;font-weight:600}
.form-row{margin-top:14px}.form-row label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px}
.form-row input{width:100%;padding:10px 14px;font-size:14px;border:1px solid #e0e0e0;border-radius:8px;outline:none}
.form-row input:focus{border-color:#e67e22}
.success-box{text-align:center;padding:40px 20px}.success-box .icon{font-size:64px}
.success-box h2{color:#34a853;margin:12px 0 8px}.success-box .detail{font-size:13px;color:#666;margin:3px 0}
.qr-box{width:140px;height:140px;margin:16px auto;background:#f0f0f0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px}
.bottom-bar{background:#fff;padding:16px 24px;border-radius:0 0 16px 16px;border-top:1px solid #eee;display:flex;gap:12px;justify-content:center}
.btn{padding:10px 24px;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:.15s}
.btn-outline{background:#fff;color:#e67e22;border:1px solid #e67e22}
.btn-primary{background:#e67e22;color:#fff}.btn-primary:hover{background:#d35400}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;padding:10px 14px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.search-bar input:focus{border-color:#e67e22}
</style>
</head>
<body>
<div class="app">
<div class="top-bar"><span class="icon">💰</span><div style="flex:1"><h1>智慧医院 · 门诊缴费</h1><div class="sub">支持医保结算 · 微信/支付宝</div></div><a class="home-link" href="home.html">🏠 主页</a></div>
<div class="summary-bar">
  <div class="summary-item"><div class="val" id="cntUnpaid">1</div><div class="lab">待缴费</div></div>
  <div class="summary-item"><div class="val" id="sumUnpaid">¥86.30</div><div class="lab">待缴金额</div></div>
  <div class="summary-item"><div class="val" id="cntPaid">2</div><div class="lab">已缴费</div></div>
</div>
<div class="tabs"><div class="tab active" onclick="st('all')">全部<span class="badge" style="background:#e67e22" id="badgeAll">3</span></div><div class="tab" onclick="st('unpaid')">待缴费<span class="badge" style="background:#e67e22" id="badgeUnpaid">1</span></div><div class="tab" onclick="st('paid')">已缴费<span class="badge" style="background:#27ae60" id="badgePaid">2</span></div></div>
<div class="content" id="content"></div>
<div class="bottom-bar" id="bar"><button class="btn btn-outline" id="btnBack" onclick="rl()" style="display:none">← 返回</button><button class="btn btn-primary" id="btnPay" onclick="goPay()" style="display:none">💳 去缴费</button></div>
</div>
<script>
const bills=[
  {id:'BL20260729001',ttl:'骨科门诊费',dept:'骨科',doc:'吴大伟',date:'2026-07-29',status:'unpaid',total:86.30,insurance:55.00,self:31.30,
    items:[{n:'挂号费',a:25},{n:'检查费',a:36.3},{n:'药费',a:25}]},
  {id:'BL20260728003',ttl:'血常规+生化',dept:'检验科',doc:'-',date:'2026-07-28',status:'paid',total:128.50,insurance:100.00,self:28.50,
    items:[{n:'血常规',a:35},{n:'肝功能',a:48.5},{n:'肾功能',a:45}]},
  {id:'BL20260727008',ttl:'CT检查费',dept:'影像科',doc:'-',date:'2026-07-27',status:'paid',total:360,insurance:252,self:108,
    items:[{n:'胸部CT平扫',a:360}]}
];
let curTab='all',selBill=null,view='list',payStep=0;

function st(t){curTab=t;document.querySelectorAll('.tab').forEach(tt=>tt.classList.remove('active'));event.target.classList.add('active');rl()}
function gf(){return curTab==='all'?bills:bills.filter(b=>b.status===curTab)}
function udSum(){
  const u=bills.filter(b=>b.status==='unpaid'), p=bills.filter(b=>b.status==='paid');
  document.getElementById('cntUnpaid').textContent=u.length;
  document.getElementById('sumUnpaid').textContent='¥'+u.reduce((s,b)=>s+b.total,0).toFixed(2);
  document.getElementById('cntPaid').textContent=p.length;
  document.getElementById('badgeAll').textContent=bills.length;
  document.getElementById('badgeUnpaid').textContent=u.length;
  document.getElementById('badgePaid').textContent=p.length;
}

function rl(){view='list';selBill=null;payStep=0;
  const list=gf();let h='<div class="search-bar"><input type="text" placeholder="🔍 搜索账单..." oninput="sr(this.value)"></div>';
  if(!list.length){h+='<div style="text-align:center;padding:40px;color:#999">暂无账单</div>'}
  list.forEach(b=>{
    const sc=b.status==='unpaid'?'s-unpaid':'s-paid',sl=b.status==='unpaid'?'待缴费':'已缴费';
    h+=`<div class="bill-card" onclick="sd('${b.id}')"><div class="hdr"><div><div class="ttl">${b.ttl}</div><div class="dept">${b.dept} · ${b.doc}</div><div class="date">${b.date}</div></div><span class="status ${sc}">${sl}</span></div><div class="items">${b.items.map(i=>`<div class="item"><span>${i.n}</span><span class="ln">¥${i.a.toFixed(2)}</span></div>`).join('')}</div><div class="footer"><span></span><span class="total">¥${b.total.toFixed(2)}</span></div></div>`;
  });
  document.getElementById('content').innerHTML=h;ub();
}
function sr(k){
  const list=bills.filter(b=>b.ttl.includes(k)||b.dept.includes(k)||b.doc.includes(k));
  if(!list.length){ document.getElementById('content').innerHTML='<div class="search-bar"><input type="text" placeholder="🔍 搜索..." value="'+k+'" oninput="sr(this.value)"></div><div style="text-align:center;padding:40px;color:#999">未找到匹配账单</div>'; return; }
  let h='<div class="search-bar"><input type="text" placeholder="🔍 搜索..." value="'+k+'" oninput="sr(this.value)"></div>';
  list.forEach(b=>{
    const sc=b.status==='unpaid'?'s-unpaid':'s-paid',sl=b.status==='unpaid'?'待缴费':'已缴费';
    h+=`<div class="bill-card" onclick="sd('${b.id}')"><div class="hdr"><div><div class="ttl">${b.ttl}</div><div class="dept">${b.dept} · ${b.doc}</div><div class="date">${b.date}</div></div><span class="status ${sc}">${sl}</span></div><div class="items">${b.items.map(i=>`<div class="item"><span>${i.n}</span><span class="ln">¥${i.a.toFixed(2)}</span></div>`).join('')}</div><div class="footer"><span></span><span class="total">¥${b.total.toFixed(2)}</span></div></div>`;
  });
  document.getElementById('content').innerHTML=h; ub();
}

function sd(id){view='detail';selBill=bills.find(b=>b.id===id);if(!selBill)return;payStep=0;
  const b=selBill,sc=b.status==='unpaid'?'s-unpaid':'s-paid',sl=b.status==='unpaid'?'待缴费':'已缴费';
  let h=`<h2>账单详情</h2><div class="detail-panel"><div class="row"><span class="lbl">账单编号</span><span>${b.id}</span></div><div class="row"><span class="lbl">项目名称</span><span style="font-weight:600">${b.ttl}</span></div><div class="row"><span class="lbl">科室</span><span>${b.dept} · ${b.doc}</span></div><div class="row"><span class="lbl">日期</span><span>${b.date}</span></div><div class="row"><span class="lbl">状态</span><span class="status ${sc}">${sl}</span></div></div><h3 style="font-size:13px;color:#999;margin:16px 0 8px">费用明细</h3>`;
  b.items.forEach(i=>{h+=`<div class="detail-panel" style="margin-bottom:6px"><div class="row"><span class="lbl">项目</span><span>${i.n}</span></div><div class="row"><span class="lbl">金额</span><span style="font-weight:600">¥${i.a.toFixed(2)}</span></div></div>`});
  h+=`<div class="insurance-breakdown"><div class="row"><span>费用总计</span><span>¥${b.total.toFixed(2)}</span></div><div class="row"><span>医保统筹</span><span style="color:#27ae60">-¥${(b.insurance||0).toFixed(2)}</span></div><div class="row"><span>个人账户</span><span style="color:#27ae60">-¥${(b.self||0).toFixed(2)}</span></div><div class="row total"><span>实付金额</span><span style="color:#e67e22;font-size:16px">¥${(b.total-(b.insurance||0)-(b.self||0)).toFixed(2)}</span></div></div>`;
  document.getElementById('content').innerHTML=h;ub();
}

function goPay(){
  if(!selBill||selBill.status!=='unpaid')return;
  payStep=1;
  let h=`<h2>💳 选择支付方式</h2><div class="detail-panel"><div class="row"><span class="lbl">账单</span><span style="font-weight:600">${selBill.ttl}</span></div><div class="row"><span class="lbl">实付金额</span><span style="color:#e67e22;font-weight:700;font-size:16px">¥${(selBill.total-(selBill.insurance||0)-(selBill.self||0)).toFixed(2)}</span></div></div><div class="method-grid"><div class="method-card" onclick="cfmPay('微信支付')"><span class="icon">💚</span><div class="name">微信</div></div><div class="method-card" onclick="cfmPay('支付宝')"><span class="icon">💙</span><div class="name">支付宝</div></div><div class="method-card" onclick="cfmPay('医保卡')"><span class="icon">🏥</span><div class="name">医保卡</div></div><div class="method-card" onclick="cfmPay('银行卡')"><span class="icon">💳</span><div class="name">银行卡</div></div></div>`;
  document.getElementById('content').innerHTML=h;ub();
}

function cfmPay(method){
  const amount=(selBill.total-(selBill.insurance||0)-(selBill.self||0)).toFixed(2);
  let h=`<h2>确认支付</h2><div class="detail-panel"><div class="row"><span class="lbl">账单</span><span>${selBill.ttl}</span></div><div class="row"><span class="lbl">支付方式</span><span style="font-weight:600">${method}</span></div><div class="row"><span class="lbl">支付金额</span><span style="color:#e67e22;font-weight:700;font-size:16px">¥${amount}</span></div></div><div class="form-row"><label>支付密码</label><input type="password" id="pwd" placeholder="6位支付密码"></div><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="doPay('${method}','${amount}')">✅ 确认支付 ¥${amount}</button>`;
  document.getElementById('content').innerHTML=h;ub();
}

function doPay(m,a){
  const p=document.getElementById('pwd').value;
  if(!p||p.length<6){alert('请输入6位支付密码');return}
  selBill.status='paid';udSum();
  document.getElementById('content').innerHTML=`<div class="success-box"><div class="icon">✅</div><h2>支付成功</h2><div class="detail">${selBill.ttl}</div><div class="detail">支付方式：${m}</div><div class="detail" style="font-weight:700;color:#e67e22;margin-top:6px">¥${a}</div><div class="qr-box">📱</div><div class="detail" style="color:#999">可在「已缴费」中查看电子发票</div></div>`;
  ub();
}

function ub(){
  document.getElementById('btnBack').style.display=view==='detail'?'inline-block':'none';
  document.getElementById('btnPay').style.display=(view==='detail'&&selBill&&selBill.status==='unpaid'&&payStep===0)?'inline-block':'none';
}
rl();udSum();
</script>
</body>
</html>
