# Fara Tutorial Guide RAG — Miniforge 一键建环境
#
# 用法（git clone 后即可，详见 README「环境准备」）:
#   conda env create -f environment.yml     # 创建环境（名称 fara15，含全部依赖）
#   conda activate fara15                   # 激活
#
# 说明:
#   - Miniforge 默认使用 conda-forge 频道，开源免费、无商业授权限制
#   - python 版本固定 3.12（与项目开发一致）
#   - vllm/torch/transformers 等包通过 pip 段安装（conda 源版本不全，
#     且 vllm 0.19.1 cu12 组合需精确锁定，见 requirements.txt 版本说明）
#   - 若驱动仅支持 CUDA 12.x，务必保持 requirements.txt 中 cu12 锁定组合
name: fara15
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
